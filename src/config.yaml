site:
  name: 'Meridian'                    # ← Replace with client brand/practitioner name
  site: 'https://example.com'         # ← Replace with client domain — required for sitemap
  base: '/'
  trailingSlash: false

  # googleSiteVerificationId: 'ADD-CODE-FROM-GOOGLE-SEARCH-CONSOLE'

# Default SEO metadata
metadata:
  title:
    default: 'Meridian: A Practice for People Who Want to Do the Work Well'
    template: '%s: Meridian'
  description: 'Meridian is a considered practice offering private consultation, group programs, and focused intensives, support built around your real life and goals.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: 'Meridian'
    images:
      - url: '~/assets/images/og-default.png' # Create a 1200x628px branded image per client
        width: 1200
        height: 628
    type: website
  twitter:
    handle: ''   # Add @handle only if client has Twitter/X; card tags still render for other previews
    site: ''
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'light:only' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
